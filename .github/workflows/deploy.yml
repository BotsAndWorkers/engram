name: Deploy Engram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply engram-db --remote

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler deploy)
          echo "$OUTPUT"
          WORKER_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n1)
          if [ -z "$WORKER_URL" ]; then
            echo "Could not detect workers.dev URL from wrangler output"
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Register Telegram webhook and menu commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          node -e '
          (async () => {
            const base = `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}`;
            const workerUrl = process.env.WORKER_URL;
            const whRes = await fetch(`${base}/setWebhook`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                url: `${workerUrl}/webhook`,
                secret_token: process.env.TELEGRAM_WEBHOOK_SECRET,
              }),
            });
            const whData = await whRes.json();
            console.log("setWebhook:", whData.ok, whData.description);
            if (!whRes.ok || !whData.ok) process.exit(1);

            const cmdRes = await fetch(`${base}/setMyCommands`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                commands: [
                  { command: "menu", description: "Главное меню" },
                  { command: "app", description: "Открыть Mini App" },
                  { command: "notes", description: "Заметки и поиск" },
                  { command: "reminders", description: "Напоминания" },
                  { command: "lists", description: "Списки и чеклисты" },
                  { command: "memory", description: "Долгосрочная память" },
                  { command: "voice", description: "Голосовые ответы" },
                  { command: "export", description: "Экспорт заметок (.md)" },
                  { command: "model", description: "Выбор модели AI" },
                  { command: "tz", description: "Часовой пояс" },
                  { command: "clear", description: "Очистить историю чата" },
                  { command: "help", description: "Справка" }
                ]
              }),
            });
            const cmdData = await cmdRes.json();
            console.log("setMyCommands:", cmdData.ok, cmdData.description);
            if (!cmdRes.ok || !cmdData.ok) process.exit(1);

            const menuBtnRes = await fetch(`${base}/setChatMenuButton`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                menu_button: {
                  type: "web_app",
                  text: "Engram",
                  web_app: { url: `${workerUrl}/app` }
                }
              }),
            });
            const menuBtnData = await menuBtnRes.json();
            console.log("setChatMenuButton:", menuBtnData.ok, menuBtnData.description);
            if (!menuBtnRes.ok || !menuBtnData.ok) process.exit(1);
          })();
          '

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IO_API_KEY: ${{ secrets.IO_API_KEY }}
        run: |
          node -e '
          const secrets = {
            TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
            TELEGRAM_WEBHOOK_SECRET: process.env.TELEGRAM_WEBHOOK_SECRET,
            ALLOWED_USER_IDS: process.env.ALLOWED_USER_IDS,
          };
          for (const k of ["GEMINI_API_KEY", "GROQ_API_KEY", "IO_API_KEY"]) {
            if (process.env[k]) secrets[k] = process.env[k];
          }
          console.log(JSON.stringify(secrets));
          ' | npx wrangler secret bulk
