name: Deploy Engram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply engram-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Register Telegram webhook and menu commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          node -e '
          (async () => {
            const base = `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}`;
            const whRes = await fetch(`${base}/setWebhook`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                url: "https://engram.liam3301j.workers.dev/webhook",
                secret_token: process.env.TELEGRAM_WEBHOOK_SECRET,
              }),
            });
            const whData = await whRes.json();
            console.log("setWebhook:", whData.ok, whData.description);
            if (!whRes.ok || !whData.ok) process.exit(1);

            const cmdRes = await fetch(`${base}/setMyCommands`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                commands: [
                  { command: "menu", description: "Главное меню" },
                  { command: "notes", description: "Заметки и поиск" },
                  { command: "reminders", description: "Напоминания" },
                  { command: "memory", description: "Долгосрочная память" },
                  { command: "model", description: "Выбор модели AI" },
                  { command: "tz", description: "Часовой пояс" },
                  { command: "clear", description: "Очистить историю чата" },
                  { command: "help", description: "Справка" }
                ]
              }),
            });
            const cmdData = await cmdRes.json();
            console.log("setMyCommands:", cmdData.ok, cmdData.description);
            if (!cmdRes.ok || !cmdData.ok) process.exit(1);
          })();
          '

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
        run: |
          node -e "console.log(JSON.stringify({ TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET: process.env.TELEGRAM_WEBHOOK_SECRET, ALLOWED_USER_IDS: process.env.ALLOWED_USER_IDS }))" | npx wrangler secret bulk
